<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tamil TV • Live</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/dashjs@latest/dist/dash.all.min.js"></script>
<style>
:root{--bg:#080b12;--panel:#111827;--panel2:#182235;--text:#f4f7fb;--muted:#9aa8bd;--accent:#ff304f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{height:58px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#0e1420;border-bottom:1px solid #273247}
.logo{font-weight:900;letter-spacing:.4px;font-size:20px}.logo span{color:var(--accent)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;padding:14px;max-width:1500px;margin:auto}
.main{min-width:0}
.player-sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding-bottom:10px}
.video-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;border:1px solid #273247}
video{width:100%;height:100%;object-fit:contain;background:#000}
.now{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 2px}
#nowTitle{font-weight:800;font-size:17px}.status{color:var(--muted);font-size:12px;margin-top:3px}
.controls{display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:9px;padding:10px 12px;background:var(--panel2);color:var(--text);font-weight:700;cursor:pointer}
button:hover{filter:brightness(1.2)}.primary{background:var(--accent)}
.sidebar{background:var(--panel);border:1px solid #273247;border-radius:14px;overflow:hidden;height:calc(100dvh - 86px);position:sticky;top:72px;display:flex;flex-direction:column;min-height:250px}
.sidehead{padding:14px;border-bottom:1px solid #273247}
.sidehead h2{font-size:16px;margin:0 0 10px}
input,textarea{width:100%;background:#080d17;color:var(--text);border:1px solid #344158;border-radius:9px;padding:11px;font:inherit;outline:none}
#channels{overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0}
.channel{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid #202a3b;cursor:pointer}
.channel:hover{background:#1a2639}.channel.active{background:#30202b;border-left:3px solid var(--accent);padding-left:9px}
.logoBox{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;background:#273247;font-weight:900;color:#ff6b80}
.chname{font-size:13px;font-weight:750;line-height:1.3}.chmeta{font-size:11px;color:var(--muted);margin-top:4px}
.empty{padding:20px;color:var(--muted);font-size:13px}
.import-area{margin:18px 0;padding:14px;border:1px solid #273247;background:#0e1420;border-radius:12px}
.import-area summary{cursor:pointer;font-weight:800}.import-area p{font-size:13px;color:var(--muted)}
#importText{min-height:110px;margin:8px 0}
.footerNote{font-size:12px;color:var(--muted);line-height:1.5;padding:8px 2px}
@media(max-width:850px){
 .layout{display:flex;flex-direction:column;padding:10px;gap:10px}
 .player-sticky{top:0}
 .sidebar{position:relative;top:auto;height:52dvh;min-height:300px}
 .now{align-items:flex-start;flex-direction:column}
 .controls{width:100%}.controls button{flex:1}
 header{height:52px}
}
</style>
</head>
<body>
<header><div class="logo">TAMIL<span> TV</span></div><div style="color:#9aa8bd;font-size:12px">LIVE • IPTV PLAYER</div></header>
<div class="layout">
 <main class="main">
  <section class="player-sticky">
   <div class="video-wrap"><video id="video" controls playsinline autoplay></video></div>
   <div class="now"><div><div id="nowTitle">ஒரு சேனலைத் தேர்வு செய்யவும்</div><div id="status" class="status">Ready</div></div>
    <div class="controls"><button id="prev">◀ Previous</button><button id="next">Next ▶</button><button id="reload">↻ Reload</button></div>
   </div>
  </section>
 </main>
 <aside class="sidebar">
  <div class="sidehead"><h2>📺 சேனல்கள் <span id="count" style="color:#9aa8bd;font-size:12px"></span></h2><input id="search" placeholder="சேனலைத் தேடுங்கள்…"></div>
  <div id="channels"></div>
 </aside>
</div>
<script>
const starter = [
["Sun TV HD (1080p)","https://d2px1d6ssc60fw.cloudfront.net/SunTV/SunTV-HDR10-IN-index.m3u8"],
["Zee Tamil HD (1080p)","https://d2o8pibksxtln6.cloudfront.net/live/media/Zee_Tamil_HD/hls/Zee_Tamil_HD.m3u8"],
["Star Vijay UK (396p)","https://da86m1sqpm3o0.cloudfront.net/28072023/smil:starvijayuk.smil/playlist.m3u8"],
["Colors Tamil HD (720p)","https://da86m1sqpm3o0.cloudfront.net/28072023/smil:colorstamilhd11.smil/playlist.m3u8"],
["Kalaignar TV (396p)","https://segment.yuppcdn.net/240122/kalaignartv/playlist.m3u8"],
["DD Tamil HD (1080p)","https://cdn.pishow.tv/ott/live/1737/master.m3u8"],
["Raj TV (1080p)","https://livestream.rajtv.tv/hlslive/Admin/px08241087/live/RAJTV/master_1.m3u8"],
["Raj Musix Tamil (1080p)","https://livestream.rajtv.tv/hlslive/Admin/px08241087/live/Raj_Musix/master_1.m3u8"],
["Vijay Takkar APAC (1080p)","https://tglmp01.akamaized.net/out/v1/c1071012b73f4f189b202e1529e8f802/manifest.mpd"],
["Kalaignar Murasu (396p)","https://yuppmedtaorire.akamaized.net/v1/master/a0d007312bfd99c47f76b77ae26b1ccdaae76cb1/murasu_nim_https/050522/murasu/playlist.m3u8"],
["Sirippoli TV (576p)","https://segment.yuppcdn.net/240122/siripoli/playlist.m3u8"],
["Peppers TV (751p)","https://cdn.pishow.tv/ott/live/1383/master.m3u8"],
["Ultimate TV (1080p)","https://stream.ottlive.co.in/utvtamil/index.m3u8"],
["Aaryaa TV (1080p)","https://stream.ottlive.co.in/aryatvtamil/index.m3u8"],
["News18 Tamil Nadu (1080p)","https://n18syndication.akamaized.net/bpk-tv/News18_Tamil_Nadu_NW18_MOB/output01/master.m3u8"],
["Thanthi TV (576p)","https://streams.tangotv.in/THANTHITV/ORIGIN/index.m3u8"],
["News 7 Tamil (576p)","https://segment.yuppcdn.net/240122/news7/playlist.m3u8"],
["Sony Pix HD (1080p)","http://103.151.60.162:2122/play/a01d/index.m3u8?hls"],
["Cartoon Network (India) (720p)","https://drk6xq0vhn.gpcdn.net/live/cn_sd_abr/index.m3u8"],
["Discovery Channel (India) HD (720p)","https://drk6xq0vhn.gpcdn.net/live/discovery_hd_abr/index.m3u8"],
["Sana TV (1080p)","https://vglivessai.akamaized.net/us/v1/master/611d79b11b77e2f571934fd80ca1413453772ac7/b6d9e864-ec16-410a-804d-ccf8f720bfaa/index.m3u8"],
["Sana Plus (1080p)","https://mumbai-edge.smartplaytv.in/SanaPlusHD/index.m3u8"],
["NTC TV (720p)","https://galaxyott.live/hls/ntv.m3u8"],
["Puthiya Thalaimurai (576p)","https://mumt07.tangotv.in/zHjX9OFlPUTHIYAEXPRESS/index.m3u8"],
["Polimer TV (720p)","https://cdn.pishow.tv/ott/live/1241/master.m3u8"]
];
let channels = starter.map(([name,url])=>({name,url}));
let current=-1, hls=null, dashPlayer=null;
const video=document.getElementById('video'), list=document.getElementById('channels');
function setStatus(t){document.getElementById('status').textContent=t}
function cleanup(){if(hls){hls.destroy();hls=null}if(dashPlayer){dashPlayer.reset();dashPlayer=null}video.pause();video.removeAttribute('src');video.load()}
function playChannel(index){
 if(index<0||index>=channels.length)return;
 current=index;const ch=channels[index];cleanup();
 document.getElementById('nowTitle').textContent=ch.name;setStatus('Connecting…');
 renderChannels();
 const url=ch.url.trim();
 if(/\.mpd($|\?)/i.test(url)){
   if(window.dashjs){dashPlayer=dashjs.MediaPlayer().create();dashPlayer.initialize(video,url,true);dashPlayer.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED,()=>setStatus('Playing'));dashPlayer.on(dashjs.MediaPlayer.events.ERROR,()=>setStatus('Playback error — stream/DRM/CORS may block it'))}
   else setStatus('DASH player unavailable');
 } else if(window.Hls && Hls.isSupported()){
   hls=new Hls({enableWorker:true,lowLatencyMode:false});
   hls.loadSource(url);hls.attachMedia(video);
   hls.on(Hls.Events.MANIFEST_PARSED,()=>{setStatus('Stream loaded');video.play().catch(()=>setStatus('Play அழுத்தவும்'))});
   hls.on(Hls.Events.ERROR,(e,data)=>{if(data.fatal)setStatus('Playback error — link offline அல்லது CORS/geo-block')});
 } else if(video.canPlayType('application/vnd.apple.mpegurl')){
   video.src=url;video.addEventListener('loadedmetadata',()=>{setStatus('Stream loaded');video.play().catch(()=>setStatus('Play அழுத்தவும்'))},{once:true});
 } else {setStatus('இந்த browser-ல் stream format support இல்லை')}
}
function renderChannels(){
 const q=document.getElementById('search').value.toLowerCase().trim();
 const filtered=channels.map((c,i)=>({...c,i})).filter(c=>c.name.toLowerCase().includes(q));
 document.getElementById('count').textContent='('+filtered.length+')';
 list.innerHTML='';
 if(!filtered.length){list.innerHTML='<div class="empty">சேனல் கிடைக்கவில்லை.</div>';return}
 filtered.forEach(c=>{
  const el=document.createElement('div');el.className='channel'+(c.i===current?' active':'');
  const box=document.createElement('div');box.className='logoBox';box.textContent=c.name.replace(/\s*\(.*/,'').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();
  const details=document.createElement('div');details.style.minWidth='0';
  const name=document.createElement('div');name.className='chname';name.textContent=c.name;
  const meta=document.createElement('div');meta.className='chmeta';meta.textContent='LIVE CHANNEL';
  details.append(name,meta);el.append(box,details);el.onclick=()=>playChannel(c.i);list.appendChild(el)
 })
}
function parseM3U(text){
 const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean), out=[];let name='';
 for(const line of lines){
  if(line.startsWith('#EXTINF')){
   const comma=line.lastIndexOf(',');name=comma>=0?line.slice(comma+1).trim():'Unnamed Channel';
  } else if(!line.startsWith('#') && /^https?:\/\//i.test(line)){
   out.push({name:name||line,url:line});name=''
  }
 }
 return out;
}
document.getElementById('search').addEventListener('input',renderChannels);
document.getElementById('prev').onclick=()=>playChannel((current-1+channels.length)%channels.length);
document.getElementById('next').onclick=()=>playChannel((current+1)%channels.length);
document.getElementById('reload').onclick=()=>{if(current>=0)playChannel(current)};
document.getElementById('loadPlaylist').onclick=()=>{
 const parsed=parseM3U(document.getElementById('importText').value);
 if(!parsed.length){alert('சரியான M3U playlist-ஐ paste செய்யவும்.');return}
 channels=parsed;current=-1;cleanup();document.getElementById('nowTitle').textContent='ஒரு சேனலைத் தேர்வு செய்யவும்';setStatus('Playlist loaded');renderChannels();list.scrollTop=0;
};
renderChannels();
</script>
</body>
</html>
