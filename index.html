<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cable Box IPTV Player</title>
    <!-- Hls.js லைப்ரரி (HLS Streams டிவி பிரவுசரில் சீராக இயங்க) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            outline: none;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        /* முழுத்திரை வீடியோ */
        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 1;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* வலது மேல் மூலையில் தோன்றும் சேனல் எண் (Digital Cable Box Style) */
        #channel-num-badge {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 52px;
            font-weight: 800;
            color: #00ff66;
            text-shadow: 2px 2px 8px #000;
            z-index: 10;
            display: none;
        }

        /* கேபிள் டிவி இன்ஃபோ பார் (Bottom OSD Banner) */
        #info-banner {
            position: absolute;
            bottom: 30px;
            left: 5%;
            width: 90%;
            height: 100px;
            background: linear-gradient(180deg, rgba(16, 26, 43, 0.95), rgba(5, 10, 18, 0.98));
            border-left: 8px solid #00d2ff;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            padding: 0 25px;
            z-index: 15;
            transition: transform 0.4s ease, opacity 0.4s ease;
            transform: translateY(150%);
            opacity: 0;
        }

        #info-banner.show {
            transform: translateY(0);
            opacity: 1;
        }

        .banner-logo {
            width: 80px;
            height: 70px;
            object-fit: contain;
            margin-right: 25px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 4px;
        }

        .banner-details {
            flex-grow: 1;
        }

        .banner-top {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 5px;
        }

        .ch-number {
            background: #00d2ff;
            color: #000;
            font-weight: 900;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 20px;
        }

        .ch-name {
            font-size: 26px;
            font-weight: bold;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .banner-sub {
            font-size: 16px;
            color: #a0aec0;
            display: flex;
            gap: 20px;
        }

        .banner-time {
            font-size: 28px;
            font-weight: 700;
            color: #f7fafc;
            letter-spacing: 1px;
            border-left: 2px solid rgba(255,255,255,0.2);
            padding-left: 25px;
        }

        /* சேனல் வழிகாட்டி / EPG பட்டியல் (Side Menu) */
        #channel-list-menu {
            position: absolute;
            top: 0;
            left: -400px;
            width: 380px;
            height: 100%;
            background: rgba(10, 16, 26, 0.95);
            backdrop-filter: blur(8px);
            z-index: 20;
            transition: left 0.3s ease;
            box-shadow: 10px 0 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        #channel-list-menu.open {
            left: 0;
        }

        .menu-header {
            padding: 25px 20px;
            background: #00d2ff;
            color: #050b14;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .channel-items {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .channel-item {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.15s;
        }

        .channel-item.selected, .channel-item:hover {
            background: linear-gradient(90deg, rgba(0, 210, 255, 0.4), rgba(0, 210, 255, 0.05));
            border-left: 5px solid #00d2ff;
        }

        .channel-item.playing {
            color: #00ff66;
        }

        .item-num {
            width: 45px;
            font-weight: bold;
            font-size: 18px;
            color: #718096;
        }

        .channel-item.selected .item-num {
            color: #fff;
        }

        .item-name {
            font-size: 18px;
            font-weight: 500;
        }

        /* லோடிங் சுழற்சி (Buffering Spinner) */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 5px solid rgba(255,255,255,0.2);
            border-top: 5px solid #00d2ff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 0.8s linear infinite;
            z-index: 5;
            display: none;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -5
