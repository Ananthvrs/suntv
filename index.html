<!DOCTYPE html>
<html lang="ta" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tamil TV • Live IPTV</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          darkBg: '#07090e',
          panel: '#0d1322',
          panelHover: '#131c31',
          accent: '#f43f5e',
          accentHover: '#e11d48'
        }
      }
    }
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/dashjs@latest/dist/dash.all.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #07090e; }
  ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
  ::-webkit-scrollbar-thumb:hover { background: #334155; }
</style>
</head>
<body class="bg-darkBg text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-rose-500 selection:text-white">

<!-- Header -->
<header class="h-16 px-4 lg:px-8 border-b border-slate-800/80 bg-darkBg/90 backdrop-blur-md sticky top-0 z-30 flex items-center justify-between">
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-rose-500 to-pink-600 flex items-center justify-center shadow-lg shadow-rose-500/20 text-white font-black text-lg">
      <i class="fa-solid fa-tv"></i>
    </div>
    <div>
      <h1 class="font-black text-lg tracking-wide uppercase">தமிழ் <span class="text-rose-500">TV</span></h1>
      <p class="text-[11px] text-slate-400 font-medium tracking-wider">LIVE HD STREAMING</p>
    </div>
  </div>
  <div class="flex items-center gap-3">
    <button onclick="toggleModal(true)" class="px-3.5 py-2 text-xs font-bold bg-slate-800 hover:bg-slate-700 transition rounded-xl border border-slate-700/60 flex items-center gap-2 shadow-sm">
      <i class="fa-solid fa-file-arrow-up text-rose-400"></i> <span class="hidden sm:inline">Load M3U</span>
    </button>
    <div id="connectionStatus" class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Ready
    </div>
  </div>
</header>

<!-- Main Container -->
<div class="flex-1 max-w-[1600px] w-full mx-auto p-3 lg:p-5 grid grid-cols-1 lg:grid-cols-[1fr_360px] gap-4 lg:gap-6 items-start">
  
  <!-- Left Column: Video & Controls -->
  <main class="flex flex-col gap-4 min-w-0">
    <!-- Video Player Wrapper -->
    <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden border border-slate-800 shadow-2xl group">
      <video id="video" class="w-full h-full object-contain bg-black" controls playsinline autoplay></video>
      
      <!-- Overlay loader / message -->
      <div id="playerOverlay" class="absolute inset-0 bg-darkBg/80 backdrop-blur-sm flex flex-col items-center justify-center gap-3 transition-opacity duration-300 pointer-events-none opacity-0">
        <div class="w-12 h-12 rounded-full border-4 border-rose-500 border-t-transparent animate-spin"></div>
        <p id="overlayText" class="text-sm font-bold text-slate-200">சேனலை இணைக்கிறது...</p>
      </div>
    </div>

    <!-- Video Info & Action Controls -->
    <div class="bg-panel border border-slate-800/80 rounded-2xl p-4 lg:p-5 shadow-lg flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div class="min-w-0">
        <div id="nowTitle" class="font-extrabold text-lg lg:text-xl truncate text-white">சேனலைத் தேர்வு செய்யவும்</div>
        <div id="status" class="text-xs text-slate-400 font-medium mt-1 flex items-center gap-1.5">
          <i class="fa-solid fa-circle-info text-rose-500"></i> பட்டியல் அல்லது தேடல் மூலம் நேரலைத் தொடங்கவும்
        </div>
      </div>
      
      <div class="flex items-center gap-2 self-stretch sm:self-auto">
        <button id="prev" title="முந்தைய சேனல்" class="flex-1 sm:flex-none px-4 py-2.5 bg-slate-800 hover:bg-slate-700 active:scale-95 transition rounded-xl font-bold text-xs flex items-center justify-center gap-2 border border-slate-700/50">
          <i class="fa-solid fa-backward-step"></i> <span class="hidden md:inline">Prev</span>
        </button>
        <button id="next" title="அடுத்த சேனல்" class="flex-1 sm:flex-none px-4 py-2.5 bg-slate-800 hover:bg-slate-700 active:scale-95 transition rounded-xl font-bold text-xs flex items-center justify-center gap-2 border border-slate-700/50">
          <span class="hidden md:inline">Next</span> <i class="fa-solid fa-forward-step"></i>
        </button>
        <button id="reload" title="மீண்டும் ஏற்று" class="flex-1 sm:flex-none px-4 py-2.5 bg-rose-600 hover:bg-rose-500 active:scale-95 transition rounded-xl font-bold text-xs flex items-center justify-center gap-2 text-white shadow-lg shadow-rose-600/20">
          <i class="fa-solid fa-rotate-right"></i> <span class="hidden md:inline">Reload</span>
        </button>
      </div>
    </div>
  </main>

  <!-- Right Column: Channels Sidebar -->
  <aside class="bg-panel border border-slate-800/80 rounded-2xl overflow-hidden flex flex-col h-[600px] lg:h-[calc(100vh-128px)] lg:sticky lg:top-20 shadow-xl">
    <!-- Sidebar Header -->
    <div class="p-4 border-b border-slate-800/80 bg-slate-900/50 flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <h2 class="font-black text-sm uppercase tracking-wider flex items-center gap-2 text-slate-200">
          <i class="fa-solid fa-list text-rose-500"></i> சேனல் பட்டியல் <span id="count" class="text-xs font-semibold px-2 py-0.5 bg-slate-800 rounded-full text-slate-400"></span>
        </h2>
        <button onclick="resetPlaylist()" title="இயல்புநிலை சேனல்கள்" class="text-[11px] text-slate-400 hover:text-rose-400 transition font-bold">
          <i class="fa-solid fa-rotate"></i> Reset
        </button>
      </div>
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
        <input id="search" type="text" placeholder="சேனலைத் தேடுங்கள் (Search)..." class="w-full bg-darkBg text-xs text-slate-100 placeholder:text-slate-500 border border-slate-800 rounded-xl pl-9 pr-3.5 py-2.5 focus:outline-none focus:border-rose-500 transition shadow-inner">
      </div>
    </div>

    <!-- Channels List -->
    <div id="channels" class="overflow-y-auto flex-1 divide-y divide-slate-800/40 overscroll-contain"></div>
  </aside>
</div>

<!-- Modal for Custom M3U Import -->
<div id="importModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
  <div class="bg-panel border border-slate-800 w-full max-w-lg rounded-2xl p-6 shadow-2xl flex flex-col gap-4 relative animate-in fade-in zoom-in duration-200">
    <div class="flex items-center justify-between">
      <h3 class="font-extrabold text-base flex items-center gap-2"><i class="fa-solid fa-file-import text-rose-500"></i> M3U Playlist இறக்குமதி</h3>
      <button onclick="toggleModal(false)" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <p class="text-xs text-slate-400 leading-relaxed">உங்கள் சொந்த M3U அல்லது M3U8 IPTV பிளேலிஸ்ட் வாசகங்களை கீழே ஒட்டவும் அல்லது இயல்புநிலை பட்டியலில் இருந்து தேர்வு செய்யவும்.</p>
    <textarea id="importText" placeholder="#EXTINF:-1 tvg-id=&quot;&quot;, Sun TV HD&#10;https://example.com/stream.m3u8" class="w-full h-36 bg-darkBg text-xs text-slate-200 border border-slate-800 rounded-xl p-3 focus:outline-none focus:border-rose-500 resize-none font-mono"></textarea>
    <div class="flex items-center justify-end gap-3 pt-2">
      <button onclick="toggleModal(false)" class="px-4 py-2 text-xs font-bold bg-slate-800 hover:bg-slate-700 rounded-xl transition">ரத்துசெய்</button>
      <button id="loadPlaylist" class="px-5 py-2 text-xs font-bold bg-rose-600 hover:bg-rose-500 rounded-xl transition text-white shadow-lg shadow-rose-600/20">ஏற்று & இயக்கு</button>
    </div>
  </div>
</div>

<script>
// Verified & Stable Tamil / Indian IPTV Streams
const starter = [
  ["Sun TV HD (1080p)", "https://d2px1d6ssc60fw.cloudfront.net/SunTV/SunTV-HDR10-IN-index.m3u8"],
  ["Zee Tamil HD (1080p)", "https://d2o8pibksxtln6.cloudfront.net/live/media/Zee_Tamil_HD/hls/Zee_Tamil_HD.m3u8"],
  ["Colors Tamil HD (720p)", "https://da86m1sqpm3o0.cloudfront.net/28072023/smil:colorstamilhd11.smil/playlist.m3u8"],
  ["Kalaignar TV (396p)", "https://segment.yuppcdn.net/240122/kalaignartv/playlist.m3u8"],
  ["DD Tamil HD (1080p)", "https://cdn.pishow.tv/ott/live/1737/master.m3u8"],
  ["Raj TV (1080p)", "https://livestream.rajtv.tv/hlslive/Admin/px08241087/live/RAJTV/master_1.m3u8"],
  ["Raj Musix Tamil (1080p)", "https://livestream.rajtv.tv/hlslive/Admin/px08241087/live/Raj_Musix/master_1.m3u8"],
  ["Vijay Takkar APAC (1080p)", "https://tglmp01.akamaized.net/out/v1/c1071012b73f4f189b202e1529e8f802/manifest.mpd"],
  ["Kalaignar Murasu (396p)", "https://yuppmedtaorire.akamaized.net/v1/master/a0d007312bfd99c47f76b77ae26b1ccdaae76cb1/murasu_nim_https/050522/murasu/playlist.m3u8"],
  ["Sirippoli TV (576p)", "https://segment.yuppcdn.net/240122/siripoli/playlist.m3u8"],
  ["Peppers TV (751p)", "https://cdn.pishow.tv/ott/live/1383/master.m3u8"],
  ["Ultimate TV (1080p)", "https://stream.ottlive.co.in/utvtamil/index.m3u8"],
  ["Aaryaa TV (1080p)", "https://stream.ottlive.co.in/aryatvtamil/index.m3u8"],
  ["News18 Tamil Nadu (1080p)", "https://n18syndication.akamaized.net/bpk-tv/News18_Tamil_Nadu_NW18_MOB/output01/master.m3u8"],
  ["Thanthi TV (576p)", "https://streams.tangotv.in/THANTHITV/ORIGIN/index.m3u8"],
  ["News 7 Tamil (576p)", "https://segment.yuppcdn.net/240122/news7/playlist.m3u8"],
  ["Cartoon Network India (720p)", "https://drk6xq0vhn.gpcdn.net/live/cn_sd_abr/index.m3u8"],
  ["Discovery Channel HD (720p)", "https://drk6xq0vhn.gpcdn.net/live/discovery_hd_abr/index.m3u8"],
  ["Sana TV (1080p)", "https://vglivessai.akamaized.net/us/v1/master/611d79b11b77e2f571934fd80ca1413453772ac7/b6d9e864-ec16-410a-804d-ccf8f720bfaa/index.m3u8"],
  ["Sana Plus (1080p)", "https://mumbai-edge.smartplaytv.in/SanaPlusHD/index.m3u8"],
  ["NTC TV (720p)", "https://galaxyott.live/hls/ntv.m3u8"],
  ["Puthiya Thalaimurai (576p)", "https://mumt07.tangotv.in/zHjX9OFlPUTHIYAEXPRESS/index.m3u8"],
  ["Polimer TV (720p)", "https://cdn.pishow.tv/ott/live/1241/master.m3u8"]
];

let channels = starter.map(([name, url]) => ({ name, url }));
let current = -1, hls = null, dashPlayer = null;

const video = document.getElementById('video');
const list = document.getElementById('channels');
const statusEl = document.getElementById('status');
const overlay = document.getElementById('playerOverlay');
const overlayText = document.getElementById('overlayText');

function setStatus(msg, isError = false) {
  statusEl.innerHTML = `<i class="fa-solid fa-${isError ? 'triangle-exclamation text-rose-500' : 'circle-check text-emerald-500'}"></i> ${msg}`;
}

function showOverlay(text) {
  overlayText.textContent = text;
  overlay.classList.remove('opacity-0', 'pointer-events-none');
}

function hideOverlay() {
  overlay.classList.add('opacity-0', 'pointer-events-none');
}

function cleanup() {
  if (hls) { hls.destroy(); hls = null; }
  if (dashPlayer) { dashPlayer.reset(); dashPlayer = null; }
  video.pause();
  video.removeAttribute('src');
  video.load();
}

function playChannel(index) {
  if (index < 0 || index >= channels.length) return;
  current = index;
  const ch = channels[index];
  cleanup();
  
  document.getElementById('nowTitle').textContent = ch.name;
  setStatus('இணைக்கிறது (Connecting)...');
  showOverlay(ch.name + ' ஏற்றுக்கொள்கிறது...');
  renderChannels();

  const url = ch.url.trim();

  // Handle MPEG-DASH (.mpd)
  if (/\.mpd($|\?)/i.test(url)) {
    if (window.dashjs) {
      dashPlayer = dashjs.MediaPlayer().create();
      dashPlayer.initialize(video, url, true);
      dashPlayer.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, () => {
        setStatus('இயங்குகிறது (Playing)');
        hideOverlay();
      });
      dashPlayer.on(dashjs.MediaPlayer.events.ERROR, () => {
        setStatus('பிழை: நெட்வொர்க் அல்லது CORS தடை இருக்கலாம்', true);
        hideOverlay();
      });
    } else {
      setStatus('DASH பிளேயர் கிடைக்கவில்லை', true);
      hideOverlay();
    }
  } 
  // Handle HLS (.m3u8)
  else if (window.Hls && Hls.isSupported()) {
    hls = new Hls({ enableWorker: true, lowLatencyMode: true });
    hls.loadSource(url);
    hls.attachMedia(video);
    
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      setStatus('ஸ்ட்ரீம் தயார்');
      video.play().then(() => {
        hideOverlay();
      }).catch(() => {
        setStatus('கண்காணிப்பு பிழை — Play பட்டனை அழுத்தவும்', true);
        hideOverlay();
      });
    });

    hls.on(Hls.Events.ERROR, (e, data) => {
      if (data.fatal) {
        switch (data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR:
            setStatus('நெட்வொர்க் பிழை / சேனல் ஆஃப்லைன்', true);
            hls.startLoad();
            break;
          case Hls.ErrorTypes.MEDIA_ERROR:
            setStatus('மீடியா பிழை, மீட்டமைக்கப்படுகிறது...', true);
            hls.recoverMediaError();
            break;
          default:
            setStatus('இயக்க முடியவில்லை (CORS/Geo-block)', true);
            cleanup();
            break;
        }
        hideOverlay();
      }
    });
  } 
  // Native Safari HLS Support
  else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
    video.addEventListener('loadedmetadata', () => {
      setStatus('ஸ்ட்ரீம் தயார்');
      video.play().then(() => hideOverlay()).catch(() => hideOverlay());
    }, { once: true });
  } else {
    setStatus('இந்த உலாவியில் ஸ்ட்ரீம் ஃபார்மட் ஆதரவு இல்லை', true);
    hideOverlay();
  }
}

function renderChannels() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const filtered = channels.map((c, i) => ({ ...c, i })).filter(c => c.name.toLowerCase().includes(q));
  
  document.getElementById('count').textContent = filtered.length;
  list.innerHTML = '';
  
  if (!filtered.length) {
    list.innerHTML = '<div class="p-6 text-center text-slate-500 text-xs font-semibold">சேனல் எதுவும் கிடைக்கவில்லை.</div>';
    return;
  }
  
  filtered.forEach(c => {
    const isActive = c.i === current;
    const el = document.createElement('div');
    el.className = `flex items-center gap-3 p-3 cursor-pointer transition border-b border-slate-800/40 ${isActive ? 'bg-rose-500/10 border-l-4 border-l-rose-500' : 'hover:bg-slate-800/50'}`;
    
    const initials = c.name.replace(/\s*\(.*/, '').trim().split(/\s+/).slice(0, 2).map(x => x[0] || '').join('').toUpperCase();
    
    el.innerHTML = `
      <div class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700/60 flex items-center justify-center font-black text-xs text-rose-400 shrink-0 shadow-inner">
        ${initials || 'TV'}
      </div>
      <div class="min-w-0 flex-1">
        <div class="text-xs font-bold truncate ${isActive ? 'text-rose-400' : 'text-slate-200'}">${c.name}</div>
        <div class="text-[10px] text-slate-400 font-medium mt-0.5 flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> LIVE STREAM
        </div>
      </div>
    `;
    el.onclick = () => playChannel(c.i);
    list.appendChild(el);
  });
}

function parseM3U(text) {
  const lines = text.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  const out = [];
  let name = '';
  
  for (const line of lines) {
    if (line.startsWith('#EXTINF')) {
      const comma = line.lastIndexOf(',');
      name = comma >= 0 ? line.slice(comma + 1).trim() : 'Unnamed Channel';
    } else if (!line.startsWith('#') && /^https?:\/\//i.test(line)) {
      out.push({ name: name || 'Live Channel', url: line });
      name = '';
    }
  }
  return out;
}

function toggleModal(show) {
  const modal = document.getElementById('importModal');
  if (show) {
    modal.classList.remove('hidden');
    modal.classList.add('flex');
  } else {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }
}

function resetPlaylist() {
  channels = starter.map(([name, url]) => ({ name, url }));
  current = -1;
  cleanup();
  document.getElementById('nowTitle').textContent = 'சேனலைத் தேர்வு செய்யவும்';
  setStatus('இயல்புநிலை பட்டியல் மீட்டமைக்கப்பட்டது');
  renderChannels();
}

// Event Listeners
document.getElementById('search').addEventListener('input', renderChannels);
document.getElementById('prev').onclick = () => playChannel((current - 1 + channels.length) % channels.length);
document.getElementById('next').onclick = () => playChannel((current + 1) % channels.length);
document.getElementById('reload').onclick = () => { if (current >= 0) playChannel(current); };

document.getElementById('loadPlaylist').onclick = () => {
  const parsed = parseM3U(document.getElementById('importText').value);
  if (!parsed.length) {
    alert('சரியான M3U பிளேலிஸ்ட் வாசகங்களை உள்ளிடவும்.');
    return;
  }
  channels = parsed;
  current = -1;
  cleanup();
  document.getElementById('nowTitle').textContent = 'ஒரு சேனலைத் தேர்வு செய்யவும்';
  setStatus('புதிய பிளேலிஸ்ட் ஏற்றப்பட்டது');
  renderChannels();
  toggleModal(false);
  list.scrollTop = 0;
};

// Initial Load
renderChannels();
// Auto play first channel for instant gratification
if (channels.length > 0) {
  playChannel(0);
}
</script>
</body>
</html>
