<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cable TV IPTV Player</title>
    <!-- Hls.js லைப்ரரி -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            outline: none;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 1;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* மேல் வலது மூலையில் உள்ள சேனல் எண் */
        #channel-num-badge {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 50px;
            font-weight: 800;
            color: #00ff66;
            text-shadow: 2px 2px 8px #000;
            z-index: 10;
            display: none;
        }

        /* OSD Info Bar (Cable TV Style) */
        #info-banner {
            position: absolute;
            bottom: 30px;
            left: 5%;
            width: 90%;
            height: 100px;
            background: linear-gradient(180deg, rgba(16, 26, 43, 0.95), rgba(5, 10, 18, 0.98));
            border-left: 8px solid #00d2ff;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            padding: 0 25px;
            z-index: 15;
            transition: transform 0.4s ease, opacity 0.4s ease;
            transform: translateY(150%);
            opacity: 0;
        }

        #info-banner.show {
            transform: translateY(0);
            opacity: 1;
        }

        .banner-logo {
            width: 80px;
            height: 70px;
            object-fit: contain;
            margin-right: 25px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 4px;
        }

        .banner-details {
            flex-grow: 1;
        }

        .banner-top {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 5px;
        }

        .ch-number {
            background: #00d2ff;
            color: #000;
            font-weight: 900;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 20px;
        }

        .ch-name {
            font-size: 26px;
            font-weight: bold;
            color: #fff;
        }

        .banner-sub {
            font-size: 16px;
            color: #a0aec0;
            display: flex;
            gap: 20px;
        }

        .banner-time {
            font-size: 28px;
            font-weight: 700;
            color: #f7fafc;
            border-left: 2px solid rgba(255,255,25
